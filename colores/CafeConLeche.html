<HTML>
    <html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>RHEUM-COLORS</title>
        <link rel="icon" type="image/x-icon" href="Icono_Logo.ico">
    </head>

    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
        }

        .encabezado {
            background-color: rgb(116, 31, 31);
            width: 100%;
            margin: 0;
            padding: 5px 20px;
            color: #FFFFFF;
            align-items: center;
            display: flex;
            gap: 25px;
            box-sizing: border-box;
        }

        .margenInt {
            background-color: #FFFFFF;
            padding: 50px 10%; 
            text-align: center;
        }

        .lista {
            background-color: #f0f0f0;
            border-radius: 20px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 30px; 
        }
        .contenedor-producto {
            display: flex;         
            align-items: center; 
            justify-content: center; 
            gap: 20px;            
            padding: 20px;
        }

        .imagen-lateral {
            width: 60%;     
            height: auto;
            border-radius: 8px;     
        }

        .contenido-texto {
            text-align: left;       
        }

        .muestra{
            background-color: #DFBB97;
            border-radius: 20px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 30px; 
        }

    </style>

    <body>
        <header class="encabezado">
            <a href="index.html">
                <img src="Logo.png" alt="Logo de Rheum-Colors" width="50px">
            </a> 
            <h1> RHEUM-COLORS </h1>
        </header>

        <div class="margenInt">
            <div class="lista">
                <div class="contenedor-producto">
                    <img src="imgMuestras/CafeConLeche.png" alt="Cafe con Leche" class="imagen-lateral">
                    <div class="contenido-texto">
                      <h1 style="color: rgb(116, 31, 31);">Café con Leche</h1>
                      <p>
                        Usar 14 ml. de solución para 500 ml. de agua.
                      </p>
                      <div class="muestra">
                      </div>
                    </div>
                  </div>
            </div>
        </div>

        <div class="encabezado">
            <p>Contáctanos:</p> 
            <p>392 110 2127</p>
        </div>

    </body>
</html>
