<HTML>
    <html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>RHEUM-COLORS</title>
        <link rel="icon" type="image/x-icon" href="Icono_Logo.ico">
        <header class="encabezado">
            <a href="file:///D:/RHEUM-COLORS/Lobby.html">
                <img src="Logo.png" alt="Logo de Rheum-Colors" width="50px">
            </a> 
            <h1> RHEUM-COLORS </h1>
        </header>
    </head>

    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
        }
    
        .encabezado {
            background-color: rgb(116, 31, 31);
            width: 100%;
            margin: 0;
            padding: 5px 20px;
            color: #FFFFFF;
            align-items: center;
            display: flex;
            gap: 25px;
            box-sizing: border-box;
        }
    
        .margenInt {
            background-color: #FFFFFF;
            padding: 50px 10%; 
            text-align: center;
        }
    
        .margenInt2 {
            background-color: #FFFFFF;
            padding: 20px 5%;
        }
    
        .lista {
            background-color: #f0f0f0;
            border-radius: 20px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 30px; 
        }
    
        .Filas {
            display: flex;
            justify-content: space-around; 
            align-items: center;
            flex-wrap: wrap; 
        }
    
        .item-color {
            text-align: center;
            flex: 1;
            min-width: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    
        .item-color img {
            width: 180px; 
            height: auto;
            margin-bottom: 10px;
        }
    
        .item-color p {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: #333;
            margin: 0;
            letter-spacing: 1px;
        }
    
        .carousel-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            overflow: hidden;
            position: relative;
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
        }
    
        .carousel-slide {
            display: flex;
            width: 100%;
            transition: transform 0.5s ease-in-out;
        }
    
        .carousel-slide img {
            width: 100%;
            display: block;
        }
    
        /* --- Botones --- */
        .botones {
            text-align: center;
        }
        
        button {
            padding: 12px 18px;
            cursor: pointer;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            transition: background-color 0.3s;
        }
    
        button:hover {
            background-color: #555;
        }
    </style>

    <body>
        <div class="margenInt">
            <div class="lista">
                <div class="Filas">
                    <div class="botones">
                        <button id="prevBtn"><</button>
                    </div>

                    <div class="carousel-container">
                        <div class="carousel-slide">
                            <a href="MateriaPrima.html"><img src="Materia Prima.png" alt="Raiz de Ruibarbo"></a>
                            <img src="Gama de Colores.png" alt="Gama de Colores">
                            <img src="Instrucciones de Uso.png" alt="Instrucciones de Uso">
                            <img src="Conocenos.png" alt="Conocenos">
                        </div>
                    </div>
                
                    <div class="botones">
                        <button id="nextBtn">></button>
                    </div>
                </div>
            </div>
        </div>

        <div class="margenInt2">
            <div class="lista">
                <div class="Filas">
                    <div class="item-color">
                        <img src="Logo.png" alt="Color 1">
                        <p>#FFEFD8</p>
                    </div>
                    <div class="item-color">
                        <img src="Logo.png" alt="Color 2">
                        <p>#DFBB97</p>
                    </div>
                    <div class="item-color">
                        <img src="Logo.png" alt="Color 3">
                        <p>#9A7D4F</p>
                    </div>
                </div>
        
                <div class="Filas">
                    <div class="item-color">
                        <img src="Logo.png" alt="Color 4">
                        <p>#FFF2EC</p>
                    </div>
                    <div class="item-color">
                        <img src="Logo.png" alt="Color 5">
                        <p>#FFDDD4</p>
                    </div>
                    <div class="item-color">
                        <img src="Logo.png" alt="Color 6">
                        <p>#F3BB9A</p>
                    </div>
                </div>
            </div>
        </div>

        <script>
            const slide = document.querySelector('.carousel-slide');
            const images = document.querySelectorAll('.carousel-slide img');
    
            let contador = 0;
    
            document.getElementById('nextBtn').addEventListener('click', () => {
                if (contador >= images.length - 1) {
                    contador = 0;
                } else {
                    contador++;
                }
                actualizarCarrusel();
            });
    
            document.getElementById('prevBtn').addEventListener('click', () => {
                if (contador <= 0) {
                    contador = images.length - 1;
                } else {
                    contador--;
                }
                actualizarCarrusel();
            });
    
            function actualizarCarrusel() {
                const tamaño = document.querySelector('.carousel-container').clientWidth;
                slide.style.transform = 'translateX(' + (-tamaño * contador) + 'px)';
            }
    
            window.addEventListener('resize', actualizarCarrusel);
        </script>
    </body>
    
</html>
